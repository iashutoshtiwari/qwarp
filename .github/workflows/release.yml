name: Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without v prefix)
        required: true
        type: string
      live_qa_completed:
        description: I completed the documented live QA checklist on a disposable test system
        required: true
        default: false
        type: boolean

concurrency:
  group: qwarp-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate-build:
    name: Validate and build once
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Require master and live QA attestation
        run: |
          test "$GITHUB_REF" = refs/heads/master
          test "${{ inputs.live_qa_completed }}" = true
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify master did not move
        run: |
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-l10n-tools libasound2 libdbus-1-3 libegl1 libfontconfig1 \
            libgl1 libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxtst6
          python -m pip install -c requirements/ci.txt -e '.[dev]'
          python -m pip install -c requirements/release.txt build pyinstaller PyQt6 setuptools wheel
      - name: Quality gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src/ tests/
          ruff format src/ tests/ --check --diff
          pytest tests/ -v --tb=short
      - name: Build release artifacts
        run: bash scripts/build_artifacts.sh
      - name: Validate catalogs, metadata, checksums, and release notes
        run: |
          git diff --exit-code -- 'src/qwarp/assets/locales/*.ts'
          python scripts/check_release.py \
            --version "$RELEASE_VERSION" \
            --artifacts dist/release \
            --notes-output dist/release/RELEASE_NOTES.md
          bash scripts/smoke_frozen.sh dist/qwarp-build/qwarp "$RELEASE_VERSION"
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Upload the exact release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qwarp-${{ inputs.version }}-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  arch-package:
    name: Validate Arch package
    needs: validate-build
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qwarp-${{ inputs.version }}-release
          path: dist/release
      - name: Build and inspect package
        run: |
          pacman -Syu --noconfirm --needed \
            git python python-build python-installer python-pyqt6 \
            python-setuptools python-wheel qt6-tools
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cp "dist/release/qwarp-$RELEASE_VERSION-source.tar.gz" .
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --nodeps --cleanbuild --clean --noconfirm"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --printsrcinfo" > /tmp/generated.SRCINFO
          diff -u .SRCINFO /tmp/generated.SRCINFO
          package_file=$(find . -maxdepth 1 -name 'qwarp-*.pkg.tar.zst' -print -quit)
          bsdtar -tf "$package_file" > /tmp/package-files
          ! grep -Eq '(^|/)(warp-cli|warp-svc|warp-svc\.service)$' /tmp/package-files
          grep -q '^usr/bin/qwarp$' /tmp/package-files
          grep -q 'cloudflare-warp-bin' .SRCINFO
          ! grep -Eq '^\s*(conflicts|install)\s*=' .SRCINFO

  publish:
    name: Publish GitHub and AUR
    needs: [validate-build, arch-package]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qwarp-${{ inputs.version }}-release
          path: dist/release
      - name: Revalidate commit and checksums
        run: |
          git fetch origin master --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Attest release archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/release/qwarp-${{ inputs.version }}-linux-x86_64.tar.gz
            dist/release/qwarp-${{ inputs.version }}-source.tar.gz
      - name: Create or validate release tag
        env:
          TAG: v${{ inputs.version }}
        run: |
          remote_sha=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git tag --annotate "$TAG" --message "QWarp $TAG"
            git push origin "$TAG"
          fi
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          files=(
            "dist/release/qwarp-$RELEASE_VERSION-linux-x86_64.tar.gz"
            "dist/release/qwarp-$RELEASE_VERSION-source.tar.gz"
            "dist/release/SHA256SUMS"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/release/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${files[@]}" \
              --title "QWarp $TAG" \
              --notes-file dist/release/RELEASE_NOTES.md \
              --verify-tag
          fi
      - name: Publish synchronized AUR metadata
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          ssh_dir="$RUNNER_TEMP/qwarp-aur-ssh"
          aur_dir="$RUNNER_TEMP/qwarp-aur"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git clone ssh://aur@aur.archlinux.org/qwarp.git "$aur_dir"
          install -m644 PKGBUILD "$aur_dir/PKGBUILD"
          install -m644 .SRCINFO "$aur_dir/.SRCINFO"
          git -C "$aur_dir" config user.name 'QWarp release automation'
          git -C "$aur_dir" config user.email 'contact@ashutoshtiwari.dev'
          if [ -n "$(git -C "$aur_dir" status --porcelain)" ]; then
            git -C "$aur_dir" add PKGBUILD .SRCINFO
            git -C "$aur_dir" commit -m "Update to $RELEASE_VERSION-1"
            git -C "$aur_dir" push origin master
          else
            echo 'AUR metadata is already current.'
          fi
