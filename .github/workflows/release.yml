name: Release

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without v prefix)
        required: true
        type: string
      live_qa_completed:
        description: I completed the documented live QA checklist on a disposable test system
        required: true
        default: false
        type: boolean

concurrency:
  group: qwarp-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate-build:
    name: Validate and build once
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Require master and live QA attestation
        run: |
          test "$GITHUB_REF" = refs/heads/master
          test "${{ inputs.live_qa_completed }}" = true
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify master did not move
        run: |
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-l10n-tools libasound2 libdbus-1-3 libegl1 libfontconfig1 \
            libgl1 libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxtst6
          python -m pip install -e '.[dev]'
      - name: Quality gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src/ tests/ scripts/
          ruff format src/ tests/ scripts/ --check
          pytest -q --override-ini addopts='' --tb=short
      - name: Build and validate exact release inputs
        run: |
          bash scripts/build_artifacts.sh
          python scripts/check_locales.py
          git diff --exit-code -- 'src/qwarp/assets/locales/*.ts'
          python scripts/check_release.py --version "$RELEASE_VERSION" \
            --artifacts dist/release --release --notes-output dist/release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qwarp-${{ inputs.version }}-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  packages:
    needs: validate-build
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      artifact: qwarp-${{ inputs.version }}-release
      version: ${{ inputs.version }}
      release: true

  publish:
    name: Publish GitHub and AUR
    needs: [validate-build, packages]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Download exact release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qwarp-${{ inputs.version }}-release
          path: dist/release

      - name: Download .deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qwarp-${{ inputs.version }}-release-debian
          path: dist/release
      - name: Download .rpm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qwarp-${{ inputs.version }}-release-rpm
          path: dist/release

      - name: Revalidate commit and checksum every public artifact
        run: |
          git fetch origin master --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          (cd dist/release && sha256sum --check SHA256SUMS)
          python scripts/check_release.py --version "$RELEASE_VERSION" \
            --artifacts dist/release --release --require-native --write-checksums
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Require an unused release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          grep_status=0
          grep -Fx "v$RELEASE_VERSION" "$RUNNER_TEMP/release-tags" > /dev/null || grep_status=$?
          case "$grep_status" in
            1) ;;
            0) echo 'Published releases are immutable; select a new version.' >&2; exit 1 ;;
            *) echo 'Unable to validate existing release versions' >&2; exit "$grep_status" ;;
          esac
      - name: Attest every release artifact
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/release/qwarp-${{ inputs.version }}-py3-none-any.whl
            dist/release/qwarp-${{ inputs.version }}.tar.gz
            dist/release/qwarp-${{ inputs.version }}-source.tar.gz
            dist/release/qwarp_${{ inputs.version }}-1_all.deb
            dist/release/qwarp-${{ inputs.version }}-1*.rpm
            dist/release/SHA256SUMS
      - name: Create or validate release tag
        env:
          TAG: v${{ inputs.version }}
        run: |
          remote_sha=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git tag --annotate "$TAG" --message "QWarp $TAG"
            git push origin "$TAG"
          fi
      - name: Publish synchronized AUR metadata
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          ssh_dir="$RUNNER_TEMP/qwarp-aur-ssh"
          aur_dir="$RUNNER_TEMP/qwarp-aur"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git clone ssh://aur@aur.archlinux.org/qwarp.git "$aur_dir"
          install -m644 packaging/arch/PKGBUILD "$aur_dir/PKGBUILD"
          install -m644 packaging/arch/.SRCINFO "$aur_dir/.SRCINFO"
          git -C "$aur_dir" config user.name 'QWarp release automation'
          git -C "$aur_dir" config user.email 'contact@ashutoshtiwari.dev'
          if [ -n "$(git -C "$aur_dir" status --porcelain)" ]; then
            git -C "$aur_dir" add PKGBUILD .SRCINFO
            git -C "$aur_dir" commit -m "Update to $RELEASE_VERSION-1"
            git -C "$aur_dir" push origin master
          else
            echo 'AUR metadata is already current.'
          fi
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          python scripts/check_release.py --version "$RELEASE_VERSION" --artifacts dist/release --release --require-native --list > "$RUNNER_TEMP/qwarp-public-files"
          mapfile -t files < "$RUNNER_TEMP/qwarp-public-files"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          gh release create "$TAG" "${files[@]}" \
            --title "QWarp $TAG" \
            --notes-file dist/release/RELEASE_NOTES.md \
            --verify-tag
