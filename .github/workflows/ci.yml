name: CI

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Python ${{ matrix.python }} / Qt ${{ matrix.qt }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            qt: current
          - python: "3.14"
            qt: current
          - python: "3.11"
            qt: "6.6"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libgl1 \
            libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxtst6 qt6-l10n-tools
          python -m pip install -e '.[dev]'
      - name: Select minimum Qt
        if: matrix.qt == '6.6'
        # These pins exercise the compatibility boundary; application dependencies remain ranges.
        run: python -m pip install 'PyQt6==6.6.0' 'PyQt6-Qt6==6.6.0'
      - name: Lint, format, and validate workflows
        if: matrix.python == '3.11' && matrix.qt == 'current'
        run: |
          ruff check src/ tests/ scripts/ --output-format=github
          ruff format src/ tests/ scripts/ --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$RUNNER_TEMP/actionlint/actionlint"
          shellcheck scripts/*.sh
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --override-ini addopts='' --tb=short

  build:
    name: Build Python packages and native source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-l10n-tools
          python -m pip install build
      - name: Read application version
        id: version
        run: echo "version=$(PYTHONPATH=src python -c 'from qwarp import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build and validate
        run: |
          bash scripts/build_artifacts.sh
          python scripts/check_locales.py
          git diff --exit-code -- 'src/qwarp/assets/locales/*.ts'
          (cd dist/release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: [quality, build]
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      artifact: ci-release-artifacts
      version: ${{ needs.build.outputs.version }}
