name: CI

permissions: {}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libgl1 \
            libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxtst6
      - name: Install project
        run: python -m pip install -c requirements/ci.txt -e '.[dev]'
      - name: Ruff
        run: |
          ruff check src/ tests/ --output-format=github
          ruff format src/ tests/ --check --diff
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short

  minimum-qt:
    name: Minimum supported Qt binding
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimum Qt and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libgl1 \
            libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxtst6
          python -m pip install 'PyQt6==6.6.0' 'PyQt6-Qt6==6.6.0' pytest
          python -m pip install --no-deps -e .
      - name: Test minimum Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short

  package:
    name: Build and smoke-test release artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-l10n-tools libasound2 libdbus-1-3 libegl1 libfontconfig1 \
            libgl1 libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxtst6
          python -m pip install -c requirements/release.txt build pyinstaller PyQt6 setuptools wheel
      - name: Build artifacts
        run: bash scripts/build_artifacts.sh
      - name: Verify locales and release metadata
        run: |
          git diff --exit-code -- 'src/qwarp/assets/locales/*.ts'
          python scripts/check_release.py --version 0.9.2 --artifacts dist/release
      - name: Verify standalone binary
        run: bash scripts/smoke_frozen.sh dist/qwarp-build/qwarp 0.9.2
      - name: Upload package inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-release-artifacts
          path: dist/release/
          retention-days: 7

  arch-package:
    name: Validate Arch package ownership
    needs: package
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-release-artifacts
          path: dist/release
      - name: Build package without runtime dependency resolution
        run: |
          pacman -Syu --noconfirm --needed \
            git python python-build python-installer python-pyqt6 \
            python-setuptools python-wheel qt6-tools
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cp dist/release/qwarp-0.9.2-source.tar.gz .
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --nodeps --cleanbuild --clean --noconfirm"
      - name: Verify metadata and owned files
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --printsrcinfo" > /tmp/generated.SRCINFO
          diff -u .SRCINFO /tmp/generated.SRCINFO
          package_file=$(find . -maxdepth 1 -name 'qwarp-*.pkg.tar.zst' -print -quit)
          test -n "$package_file"
          bsdtar -tf "$package_file" > /tmp/package-files
          ! grep -Eq '(^|/)(warp-cli|warp-svc|warp-svc\.service)$' /tmp/package-files
          grep -q '^usr/bin/qwarp$' /tmp/package-files
          grep -q '^usr/share/doc/qwarp/TRADEMARKS.md$' /tmp/package-files
          grep -q '^usr/share/licenses/qwarp/Apache-2.0.txt$' /tmp/package-files
          grep -q '^usr/share/licenses/qwarp/Glyphs-Poly-MIT.txt$' /tmp/package-files
          grep -q 'cloudflare-warp-bin' .SRCINFO
          ! grep -Eq '^\s*(conflicts|install)\s*=' .SRCINFO

  debian-package:
    name: Build Debian package
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-release-artifacts
          path: dist/release
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-build qt6-l10n-tools \
            qt6-tools-dev-tools dpkg-dev python3-pyqt6
      - name: Build .deb
        run: |
          tar xzf dist/release/qwarp-0.9.2-source.tar.gz
          cd qwarp-0.9.2
          cp -r ../packaging/debian debian
          dpkg-buildpackage -us -uc -b
      - name: Inspect and smoke-test .deb
        run: |
          dpkg-deb --contents qwarp_0.9.2-1_all.deb > /tmp/qwarp-deb-files
          grep -q 'usr/bin/qwarp$' /tmp/qwarp-deb-files
          grep -q 'usr/share/doc/qwarp/TRADEMARKS.md$' /tmp/qwarp-deb-files
          grep -q 'usr/share/doc/qwarp/Apache-2.0.txt$' /tmp/qwarp-deb-files
          grep -q 'usr/share/doc/qwarp/Glyphs-Poly-MIT.txt$' /tmp/qwarp-deb-files
          ! grep -Eq '/(warp-cli|warp-svc|warp-svc\.service)$' /tmp/qwarp-deb-files
          dpkg-deb --field qwarp_0.9.2-1_all.deb Depends | grep -q 'cloudflare-warp'
          mkdir -p /tmp/qwarp-deb-root
          dpkg-deb --extract qwarp_0.9.2-1_all.deb /tmp/qwarp-deb-root
          PYTHONPATH=/tmp/qwarp-deb-root/usr/lib/python3/dist-packages \
            python3 -m qwarp.main --version | grep -Fx 'QWarp 0.9.2'
      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qwarp-deb
          path: qwarp_0.9.2-1_all.deb
          retention-days: 7

  rpm-package:
    name: Build RPM package
    needs: package
    runs-on: ubuntu-22.04
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-release-artifacts
          path: dist/release
      - name: Install dependencies
        run: |
          dnf install -y rpm-build python3-devel python3-setuptools \
            python3-build python3-pip python3-wheel pyproject-rpm-macros \
            qt6-linguist rpmdevtools
      - name: Build .rpm
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/release/qwarp-0.9.2-source.tar.gz ~/rpmbuild/SOURCES/
          cp packaging/rpm/qwarp.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/qwarp.spec
      - name: Inspect RPM
        run: |
          rpm_file=$(find ~/rpmbuild/RPMS -name 'qwarp-0.9.2-1*.rpm' -print -quit)
          test -n "$rpm_file"
          rpm -qlp "$rpm_file" > /tmp/qwarp-rpm-files
          grep -q '/usr/bin/qwarp$' /tmp/qwarp-rpm-files
          grep -q '/usr/share/doc/qwarp/TRADEMARKS.md$' /tmp/qwarp-rpm-files
          grep -q '/usr/share/licenses/qwarp/Apache-2.0.txt$' /tmp/qwarp-rpm-files
          grep -q '/usr/share/licenses/qwarp/Glyphs-Poly-MIT.txt$' /tmp/qwarp-rpm-files
          ! grep -Eq '/(warp-cli|warp-svc|warp-svc\.service)$' /tmp/qwarp-rpm-files
          rpm -qp --requires "$rpm_file" | grep -q 'cloudflare-warp'
      - name: Upload .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qwarp-rpm
          path: /github/home/rpmbuild/RPMS/noarch/qwarp-0.9.2-1*.rpm
          retention-days: 7
