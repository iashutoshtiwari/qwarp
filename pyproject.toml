[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwarp"
dynamic = ["version"]
description = "A Wayland-native, Qt6-based alternative desktop client for Cloudflare WARP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT AND Apache-2.0"}
dependencies = [
    "PyQt6>=6.6,<7",
]

[project.urls]
Homepage = "https://github.com/iashutoshtiwari/qwarp"
Issues = "https://github.com/iashutoshtiwari/qwarp/issues"
Changelog = "https://github.com/iashutoshtiwari/qwarp/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
qwarp = "qwarp.main:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt", "TRADEMARKS.md"]

[tool.setuptools.dynamic]
version = {attr = "qwarp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Core correctness, security, complexity, and performance checks.
select = ["E", "W", "F", "I", "B", "C4", "C90", "PERF", "RUF", "S"]
ignore = [
    "E501",   # line-too-long — handled by line-length above
    "E402",   # main.py must set Qt environment variables before Qt imports
    "S603",   # subprocess calls use explicit argv arrays and no shell
    "S607",   # supported system commands intentionally resolve through PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest assertions are intentional

[tool.ruff.lint.mccabe]
max-complexity = 18
